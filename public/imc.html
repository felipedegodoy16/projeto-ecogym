<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informações do Aluno</title>

  <style>
    :root {
      --bg-dark: #0f0f0f;
      --bg-card: #161616;
      --text-light: #e6e6e6;
      --text-muted: #9a9a9a;
      --green: #26ff70;
      --green-dark: #1fb85e;
      --border-green: #26ff7050;
      --radius: 14px;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 250px;
      background: #0b0b0b;
      padding-top: 40px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #111;
    }

    .sidebar h2 {
      color: var(--green);
      margin-left: 25px;
    }

    .menu-item {
      padding: 15px 25px;
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu-item:hover,
    .active {
      background: #0f290f;
    }

    .menu-item i {
      color: var(--green);
    }

    /* CONTEÚDO */
    .content {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
    }

    .title {
      font-size: 32px;
      margin-bottom: 25px;
      font-weight: bold;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-green);
      padding: 25px;
      border-radius: var(--radius);
      margin-bottom: 25px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 22px;
      color: var(--green);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    label {
      color: var(--text-muted);
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      margin-top: 5px;
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid #222;
      background: #0e0e0e;
      color: var(--text-light);
      font-size: 15px;
    }

    button {
      background: var(--green);
      color: black;
      border: none;
      padding: 10px 16px;
      margin-top: 15px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      background: var(--green-dark);
    }

    .result-box {
      background: #0d1f0d;
      border-left: 4px solid var(--green);
      padding: 15px;
      margin-top: 20px;
      border-radius: var(--radius);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 14px;
    }

    th {
      color: var(--green);
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #333;
    }

    td {
      padding: 10px;
      color: var(--text-light);
      border-bottom: 1px solid #1a1a1a;
    }

    .mannequin-container {
      display: flex;
      gap: 30px;
      align-items: flex-start;
      justify-content: center;
    }

    svg {
      width: 230px;
      height: 530px;
    }

    .area {
      fill: #1c1c1c;
      stroke: var(--border-green);
      stroke-width: 2px;
      transition: 0.3s;
    }

    .area:hover {
      fill: #26ff7050;
      cursor: pointer;
    }

    .legend {
      font-size: 15px;
    }

    .legend h3 {
      margin-bottom: 10px;
      color: var(--green);
    }

    .level {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      margin-right: 6px;
    }

    .level.low {
      background: #28ff8a;
    }

    .level.medium {
      background: #ffaa00;
    }

    .level.high {
      background: #ff4444;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>Menu</h2>

    <div class="menu-item active">
      <i>📊</i> Informações
    </div>

    <div class="menu-item" onclick="window.location.href='perfil.html'">
      <i>👤</i> Meu Perfil
    </div>

    <div class="menu-item" onclick="window.location.href='treinos.html'">
      <i>🏋️</i> Meus Treinos
    </div>

    <div class="menu-item" onclick="history.back()">
      <i>🏠</i> Voltar
    </div>
  </div>

  <!-- CONTEÚDO -->
  <div class="content">
    <div class="title">Informações do Aluno</div>

    <div class="card">
      <h2>Avaliação Física</h2>

      <div class="grid">
        <div>
          <label>Peso (kg)</label>
          <input type="number" id="peso">
        </div>

        <div>
          <label>Altura (m)</label>
          <input type="number" step="0.01" id="altura">
        </div>

        <div>
          <label>Cintura (cm)</label>
          <input type="number" id="cintura">
        </div>

        <div>
          <label>Pescoço (cm)</label>
          <input type="number" id="pescoco">
        </div>

        <div>
          <label>Sexo</label>
          <select id="sexo">
            <option value="homem">Homem</option>
            <option value="mulher">Mulher</option>
          </select>
        </div>
      </div>

      <button onclick="calcular()">Calcular Avaliação</button>

      <div id="resultados" class="result-box" style="display:none;"></div>
    </div>

    <div class="card">
      <h2>Histórico de Avaliações</h2>
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Peso</th>
            <th>IMC</th>
            <th>% Gordura</th>
            <th>Gordura (kg)</th>
          </tr>
        </thead>
        <tbody id="historico"></tbody>
      </table>
    </div>

  </div>

  <div class="card">
    <h2>Manequim – Gordura Localizada</h2>

    <div class="mannequin-container">
      <svg id="mannequin" viewBox="0 0 200 500">

        <!-- Tórax -->
        <path id="torax" class="area" d="M70 100 Q100 60 130 100 L130 160 Q100 200 70 160 Z" />

        <!-- Abdômen -->
        <path id="abdomen" class="area" d="M70 160 Q100 200 130 160 L130 240 Q100 270 70 240 Z" />

        <!-- Quadril -->
        <path id="quadril" class="area" d="M60 240 Q100 290 140 240 L140 300 Q100 330 60 300 Z" />

        <!-- Perna Esquerda -->
        <path id="pernaE" class="area" d="M70 300 L85 300 L85 450 L70 450 Z" />

        <!-- Perna Direita -->
        <path id="pernaD" class="area" d="M115 300 L130 300 L130 450 L115 450 Z" />

        <!-- Braço Esquerdo -->
        <path id="bracoE" class="area" d="M50 120 L70 120 L70 220 L50 220 Z" />

        <!-- Braço Direito -->
        <path id="bracoD" class="area" d="M130 120 L150 120 L150 220 L130 220 Z" />

      </svg>

      <div class="legend">
        <h3>Níveis de Gordura</h3>
        <div><span class="level low"></span> Baixa</div>
        <div><span class="level medium"></span> Média</div>
        <div><span class="level high"></span> Alta</div>
      </div>
    </div>
  </div>


  <script>
    function atualizarManequim(gordura) {
      /* gordura = percentual de gordura corporal total */

      const areas = {
        abdomen: gordura,
        torax: gordura * 0.8,
        quadril: gordura * 0.9,
        pernaE: gordura * 0.6,
        pernaD: gordura * 0.6,
        bracoE: gordura * 0.5,
        bracoD: gordura * 0.5,
      };

      for (const area in areas) {
        const nivel = areas[area];
        const el = document.getElementById(area);

        if (nivel < 15) {
          el.style.fill = "#28ff8a";  // verde
        } else if (nivel < 25) {
          el.style.fill = "#ffaa00";  // laranja
        } else {
          el.style.fill = "#ff4444";  // vermelho
        }
      }
    }


    function calcular() {
      const peso = parseFloat(document.getElementById("peso").value);
      const altura = parseFloat(document.getElementById("altura").value);
      const cintura = parseFloat(document.getElementById("cintura").value);
      const pescoco = parseFloat(document.getElementById("pescoco").value);
      const sexo = document.getElementById("sexo").value;

      if (!peso || !altura || !cintura || !pescoco) {
        alert("Preencha todos os campos.");
        return;
      }

      // IMC
      const imc = peso / (altura * altura);

      // Gordura corporal (US Navy)
      let bf;

      if (sexo === "homem") {
        bf = 86.010 * Math.log10(cintura - pescoco)
          - 70.041 * Math.log10(altura * 100)
          + 36.76;
      } else {
        const quadril = cintura * 1.15;
        bf = 163.205 * Math.log10(cintura + quadril - pescoco)
          - 97.684 * Math.log10(altura * 100)
          - 78.387;
      }

      bf = Math.max(bf, 5);
      const gorduraKg = (peso * bf) / 100;

      const resultados = document.getElementById("resultados");
      resultados.style.display = "block";
      resultados.innerHTML = `
        <strong>IMC:</strong> ${imc.toFixed(2)}<br>
        <strong>Percentual de Gordura:</strong> ${bf.toFixed(1)}%<br>
        <strong>Massa de Gordura:</strong> ${gorduraKg.toFixed(2)} kg
    `;

      adicionarHistorico(peso, imc, bf, gorduraKg);

      atualizarManequim(bf);   // bf = percentual de gordura corporal

    }

    function adicionarHistorico(peso, imc, gorduraPercentual, gorduraKg) {
      const hoje = new Date().toLocaleDateString("pt-BR");
      const historico = document.getElementById("historico");

      const linha = document.createElement("tr");
      linha.innerHTML = `
        <td>${hoje}</td>
        <td>${peso} kg</td>
        <td>${imc.toFixed(2)}</td>
        <td>${gorduraPercentual.toFixed(1)}%</td>
        <td>${gorduraKg.toFixed(2)} kg</td>
    `;

      historico.prepend(linha);
    }
  </script>

</body>

</html>
