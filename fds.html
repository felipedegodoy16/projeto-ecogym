<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Cadastro de Treino</title>
  <style>
    .exercicio-box {
      border: 1px solid #ccc;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      background: #f7f7f7;
    }
  </style>
</head>

<body>

  <h2>Cadastrar Treino</h2>

  <form id="treinoForm">

    <label>Nome do Treino:</label><br>
    <input type="text" name="nomeTreino" required><br><br>

    <label>Observações:</label><br>
    <textarea name="obs"></textarea><br><br>

    <h3>Exercícios</h3>
    <div id="listaExercicios"></div>

    <button type="button" onclick="adicionarExercicio()">Adicionar Exercício</button>
    <br><br>

    <button type="submit">Salvar Treino</button>

  </form>

  <script>
    let contador = 0;

    function adicionarExercicio() {
      contador++;

      const div = document.createElement("div");
      div.classList.add("exercicio-box");
      div.setAttribute("id", "exercicio_" + contador);

      div.innerHTML = `
            <label>Nome do Exercício:</label><br>
            <input type="text" name="exercicio_nome" required><br><br>

            <label>Séries:</label><br>
            <input type="number" name="exercicio_series" required><br><br>

            <label>Repetições:</label><br>
            <input type="number" name="exercicio_reps" required><br><br>

            <label>Carga (kg):</label><br>
            <input type="number" name="exercicio_carga"><br><br>

            <button type="button" onclick="removerExercicio(${contador})">Remover Exercício</button>
        `;

      document.getElementById("listaExercicios").appendChild(div);
    }

    function removerExercicio(id) {
      document.getElementById("exercicio_" + id).remove();
    }

    document.getElementById("treinoForm").addEventListener("submit", function (e) {
      e.preventDefault();

      // Captura os dados do treino
      const nomeTreino = this.nomeTreino.value;
      const obs = this.obs.value;

      // Captura exercícios
      const exerciciosDiv = document.querySelectorAll(".exercicio-box");
      const exercicios = [];

      exerciciosDiv.forEach(box => {
        exercicios.push({
          nome: box.querySelector('input[name="exercicio_nome"]').value,
          series: box.querySelector('input[name="exercicio_series"]').value,
          reps: box.querySelector('input[name="exercicio_reps"]').value,
          carga: box.querySelector('input[name="exercicio_carga"]').value
        });
      });

      // Monta o JSON final
      const dados = {
        treino: {
          nome: nomeTreino,
          obs: obs
        },
        exercicios: exercicios
      };

      console.log("JSON enviado:", dados);

      // Envia ao PHP via fetch
      fetch("salvarTreino.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
      })
        .then(r => r.text())
        .then(res => alert(res));
    });
  </script>

</body>

</html>
